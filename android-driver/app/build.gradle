plugins { id 'com.android.application' }
android {
    namespace 'com.temo.aquaflow.driver'
    compileSdk 35
    defaultConfig {
        applicationId 'com.temo.aquaflow.driver.nativeapp'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-native-qa'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a3a5c"><link rel="manifest" href="/customer-manifest.webmanifest"><link rel="stylesheet" href="/customer.css"><title>TEMO Customer Portal</title></head><body>
<div id="login" class="auth"><form id="loginForm" class="card"><div class="logo">T</div><h1>Customer portal</h1><p>Manage your deliveries, invoices and support requests.</p><label>Email or username<input id="identifier" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button><output id="loginError" class="error"></output></form></div>
<div id="app" class="hidden"><header><div><strong>TEMO AQUAFLOW</strong><small id="company"></small></div><button id="install" class="secondary hidden">Install app</button><button id="logout" class="secondary">Sign out</button></header><main><section class="welcome"><div><small>Customer portal</small><h1>Welcome, <span id="customerName">customer</span></h1></div><span id="offline" class="badge">Online</span></section><nav id="tabs"><button data-tab="overview" class="active">Overview</button><button data-tab="orders">Orders</button><button data-tab="billing">Invoices & payments</button><button data-tab="subscriptions">Subscriptions</button><button data-tab="support">Support</button><button data-tab="profile">Profile</button></nav><div id="message" role="status"></div><section id="overview" class="tab active"><div id="kpis" class="grid"></div><div class="panel"><h2>Recent activity</h2><div id="recent"></div></div><div class="panel"><h2>Bottle balance</h2><div id="bottles"></div></div></section><section id="orders" class="tab"><div class="panel"><div class="panel-head"><h2>Orders</h2><button id="newOrder">Place order</button></div><div id="ordersList"></div></div><form id="orderForm" class="panel hidden"><h2>Place an order</h2><div id="catalog"></div><label>Delivery address<textarea id="deliveryAddress" maxlength="500"></textarea></label><label>Notes<textarea id="orderNotes" maxlength="1000"></textarea></label><button>Submit order</button></form></section><section id="billing" class="tab"><div class="panel"><h2>Invoices</h2><div id="invoices"></div></div><div class="panel"><h2>Payments</h2><div id="payments"></div></div></section><section id="subscriptions" class="tab"><div class="panel"><h2>Recurring deliveries</h2><div id="subscriptionsList"></div></div></section><section id="support" class="tab"><form id="complaintForm" class="panel"><h2>Open a support request</h2><label>Title<input id="complaintTitle" maxlength="160" required></label><label>Details<textarea id="complaintDescription" maxlength="5000" required></textarea></label><label>Priority<select id="complaintPriority"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select></label><button>Submit request</button></form><div class="panel"><h2>Your requests</h2><div id="complaints"></div></div></section><section id="profile" class="tab"><form id="profileForm" class="panel"><h2>Profile</h2><label>Name<input id="profileName" maxlength="160" required></label><label>Email<input id="profileEmail" type="email" maxlength="160"></label><label>Phone<input id="profilePhone" maxlength="40"></label><label>Address<textarea id="profileAddress" maxlength="500"></textarea></label><button>Save profile</button></form></section></main></div><script src="/customer.js"></script></body></html>

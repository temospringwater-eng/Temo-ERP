name: TEMO QA Cloudflare D1 Remote Readiness (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-d1-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials exist without printing them
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret missing"; exit 1; }
      - name: Verify remote QA D1 table inventory (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 d1 execute temo_erp_qa_db --remote --command "SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';" --json > remote-result.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("remote-result.json","utf8"));if(!Array.isArray(r)||r[0]?.success!==true)process.exit(1);console.log("Remote QA D1 query successful (table inventory only)");'
          rm -f remote-result.json

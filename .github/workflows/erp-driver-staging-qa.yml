name: TEMO ERP Recovery and Driver Field QA
on:
  pull_request:
    paths:
      - "server.js"
      - "services/**"
      - "public/**"
      - "tests/**"
      - "migrations/**"
      - "package*.json"
      - ".github/workflows/erp-driver-staging-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovered-source-and-driver-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify restored ERP boot sources and QA isolation
        run: |
          node --check server.js
          node --test tests/source-integrity.test.cjs
      - name: Install locked ERP server dependencies
        run: npm ci --no-audit --no-fund
      - name: Native repo separation and driver RBAC backend unit regression
        run: node --test tests/native-android-architecture.test.js
      - name: Live local ERP HTTP boot and tenant isolation regression
        run: node --test tests/api-smoke.test.js tests/tenant-isolation.test.js
      - name: TDD and disposable SQLite driver field integration
        run: node --test tests/driver-field-operations.integration.test.cjs tests/driver-field-six-modules.integration.test.cjs

name: TEMO ERP Recovery and Driver Field QA
on:
  pull_request:
    paths:
      - "server.js"
      - "services/**"
      - "worker/**"
      - "public/**"
      - "tests/**"
      - "migrations/**"
      - "package*.json"
      - "scripts/cloudflare-d1-portability-audit.cjs"
      - "docs/TEMO-ERP-DRIVER-MASTER-PLAN.md"
      - "docs/CLOUDFLARE-WORKERS-D1-ARCHITECTURE.md"
      - "scripts/private-https-staging-qa.js"
      - ".github/workflows/erp-driver-staging-qa.yml"
      - "*.db"
      - "**/*.db"
      - "*.db-*"
      - "**/*.db-*"
      - "*.sqlite"
      - "**/*.sqlite"
      - "*.sqlite-*"
      - "**/*.sqlite-*"
      - "*.sqlite3"
      - "**/*.sqlite3"
      - "*.sqlite3-*"
      - "**/*.sqlite3-*"
  push:
    branches: [main]
    paths:
      - "server.js"
      - "services/**"
      - "worker/**"
      - "public/**"
      - "tests/**"
      - "migrations/**"
      - "package*.json"
      - "scripts/cloudflare-d1-portability-audit.cjs"
      - "docs/TEMO-ERP-DRIVER-MASTER-PLAN.md"
      - "docs/CLOUDFLARE-WORKERS-D1-ARCHITECTURE.md"
      - "scripts/private-https-staging-qa.js"
      - ".github/workflows/erp-driver-staging-qa.yml"
      - "*.db"
      - "**/*.db"
      - "*.db-*"
      - "**/*.db-*"
      - "*.sqlite"
      - "**/*.sqlite"
      - "*.sqlite-*"
      - "**/*.sqlite-*"
      - "*.sqlite3"
      - "**/*.sqlite3"
      - "*.sqlite3-*"
      - "**/*.sqlite3-*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovered-source-and-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      TEMO_DRIVER_FIELD_OPS_QA: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Verify recovered JavaScript and install locked dependencies
        run: |
          node --check server.js
          npm ci --no-audit --no-fund
      - name: TDD owning CI guard, recovered sources and frontend integrity
        run: node --test tests/ci-pipeline-guard.test.cjs tests/source-integrity.test.cjs
      - name: Production bootstrap fail-closed security regression
        run: timeout -k 5s 100s node --test --test-force-exit tests/bootstrap-security.test.js
      - name: Workers D1 company-scoped ERP read-only unit/integration QA
        run: node --experimental-sqlite --test tests/erp-d1-admin-summary.integration.test.cjs tests/erp-d1-read-alias-qa.integration.test.mjs tests/erp-d1-qa-worker-local.integration.test.mjs
      - name: Cloudflare Workers D1 migration architecture contract and portability inventory
        run: node --test tests/cloudflare-d1-architecture.test.cjs
      - name: TDD full pinned 114-table ERP baseline versus disposable D1 structural drift
        run: node --experimental-sqlite --test tests/d1-erp-full-schema-preflight.test.mjs tests/d1-erp-107-table-local-rehearsal.test.mjs
      - name: D1 QA migration 0001 disposable test and tracked-database guard
        run: node --experimental-sqlite --test tests/d1-qa-migration-0001.test.mjs tests/no-tracked-database-files.test.cjs tests/pr62-review-regressions.test.cjs
      - name: D1 canonical van stock unit and disposable integration QA
        run: node --experimental-sqlite --test tests/d1-canonical-stock-contract.test.mjs tests/d1-canonical-stock.integration.test.mjs tests/d1-driver-inventory-qa.integration.test.mjs
      - name: Private local HTTPS staging TLS, login and ERP role-isolation smoke
        run: |
          node --test tests/private-https-staging-security.test.cjs
          timeout -k 5s 100s node scripts/private-https-staging-qa.js
      - name: Complete ERP unit and service integration regression
        run: timeout -k 5s 230s node --test --test-force-exit --test-concurrency=1 --test-timeout=90000 tests/*.test.js
      - name: Disposable SQLite driver field integration with atomic ledger tests
        run: timeout -k 5s 100s node --test tests/driver-field-operations.integration.test.cjs tests/driver-field-six-modules.integration.test.cjs tests/driver-financial-bridge.integration.test.cjs tests/driver-finance-http-qa.integration.test.cjs tests/erp-d1-worker-readiness.integration.test.cjs tests/erp-d1-stage1-worker.integration.test.mjs
      - name: Verify isolated SQLite backup and safe rollback readiness (synthetic QA only)
        run: timeout -k 5s 100s node --test tests/sqlite-restore-drill.test.cjs tests/qa-sqlite-online-backup.integration.test.cjs

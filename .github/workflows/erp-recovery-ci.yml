name: ERP Recovery Validation
on:
  push:
    branches: ["recovery/complete-source-2026-10-23"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check mandatory source files
        run: |
          test -f server.js
          test -f public/index.html
          test -f services/forecasting-service.js
          test -f services/platform-operations-service.js
          test -f tests/api-smoke.test.js
      - name: Verify JavaScript syntax
        run: |
          find services public tests -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        # Ephemeral CI database only. Never use these sample credentials outside NODE_ENV=test.
        env:
          NODE_ENV: test
          TEMO_BOOTSTRAP_SUPERADMIN_PASSWORD: admin123
          TEMO_BOOTSTRAP_COMPANY_ADMIN_PASSWORD: admin123
        run: npm test

name: TEMO Driver Android QA APK
on:
  pull_request:
    branches: [main]
    paths:
      - "android-driver/**"
      - ".github/workflows/android-driver-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned release-free QA APK
        run: gradle -p android-driver :app:assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          test -s android-driver/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-driver/app/build/outputs/apk/debug/app-debug.apk
      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r android-driver/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.temo.aquaflow.driver/.MainActivity
            sleep 5
            adb shell pidof com.temo.aquaflow.driver
      - name: Publish QA APK to private QA branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'recovery/complete-source-2026-10-23'
        run: |
          set -euo pipefail
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/TEMO-Driver-QA.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/heads/qa/driver-apk-2026-10-23
          git switch -C qa/driver-apk-2026-10-23 FETCH_HEAD
          mkdir -p qa
          cp "$RUNNER_TEMP/TEMO-Driver-QA.apk" qa/TEMO-Driver-QA.apk
          sha256sum qa/TEMO-Driver-QA.apk > qa/TEMO-Driver-QA.apk.sha256
          git add qa/TEMO-Driver-QA.apk qa/TEMO-Driver-QA.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish latest private driver QA APK"
            git push origin HEAD:refs/heads/qa/driver-apk-2026-10-23
          fi

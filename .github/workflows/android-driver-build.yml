name: TEMO Driver Native QA APK
on:
  push:
    branches: ["recovery/complete-source-2026-10-23"]
    paths:
      - "android-driver/**"
      - ".github/workflows/android-driver-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned release-free QA APK
        run: gradle -p android-driver :app:assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          test -s android-driver/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-driver/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish QA APK to private QA branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/complete-source-2026-10-23'
        run: |
          set -euo pipefail
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/TEMO-Driver-Native-QA.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/heads/qa/driver-apk-2026-10-23
          git switch -C qa/driver-apk-2026-10-23 FETCH_HEAD
          mkdir -p qa
          cp "$RUNNER_TEMP/TEMO-Driver-Native-QA.apk" qa/TEMO-Driver-Native-QA.apk
          sha256sum qa/TEMO-Driver-Native-QA.apk > qa/TEMO-Driver-Native-QA.apk.sha256
          git add qa/TEMO-Driver-Native-QA.apk qa/TEMO-Driver-Native-QA.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish latest private driver QA APK"
            git push origin HEAD:refs/heads/qa/driver-apk-2026-10-23
          fi

      - name: Publish downloadable QA APK on private GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/complete-source-2026-10-23'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unzip -t "$RUNNER_TEMP/TEMO-Driver-Native-QA.apk" > /dev/null
          sha256sum "$RUNNER_TEMP/TEMO-Driver-Native-QA.apk"
          if ! gh release view driver-qa-2026-10-23 >/dev/null 2>&1; then
            gh release create driver-qa-2026-10-23 \
              --target "$GITHUB_SHA" \
              --title "TEMO Driver Native Android QA - internal test only" \
              --notes "Debug APK for authorized mobile testing only. Requires a trusted HTTPS TEMO ERP server. Not production signed." \
              --prerelease
          fi
          gh release upload driver-qa-2026-10-23 "$RUNNER_TEMP/TEMO-Driver-Native-QA.apk#TEMO-Driver-Native-QA.apk" --clobber
      - name: Allow Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            adb install -r "$RUNNER_TEMP/TEMO-Driver-Native-QA.apk"
            adb shell am start -W -n com.temo.aquaflow.driver.nativeapp/com.temo.aquaflow.driver.MainActivity
            sleep 5
            adb shell pidof com.temo.aquaflow.driver.nativeapp
            # Simulate runtime location authorization (this does not assert a live GPS fix).
            # Confirm that a cold restart works with connectivity disabled.
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am force-stop com.temo.aquaflow.driver.nativeapp
            adb shell am start -W -n com.temo.aquaflow.driver.nativeapp/com.temo.aquaflow.driver.MainActivity
            sleep 3
            adb shell pidof com.temo.aquaflow.driver.nativeapp
            adb shell svc wifi enable
            adb shell svc data enable
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | grep -F 'TEMO DRIVER'

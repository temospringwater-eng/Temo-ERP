name: TEMO Driver Android QA APK
on:
  push:
    branches: ["recovery/complete-source-2026-10-23"]
    paths:
      - "android-driver/**"
      - ".github/workflows/android-driver-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned release-free QA APK
        run: gradle -p android-driver :app:assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          test -s android-driver/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-driver/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: temo-driver-qa-apk
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

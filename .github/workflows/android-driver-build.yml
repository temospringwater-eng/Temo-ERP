name: TEMO Driver Android QA APK
on:
  pull_request:
    branches: [main]
    paths:
      - "android-driver/**"
      - ".github/workflows/android-driver-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned release-free QA APK
        run: gradle -p android-driver :app:assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          test -s android-driver/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-driver/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: temo-driver-qa-apk
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
